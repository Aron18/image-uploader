<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📤 图床上传工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { background: #fff; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 720px; width: 100%; overflow: hidden; }
    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 30px 40px; text-align: center; }
    .header h1 { font-size: 28px; margin-bottom: 8px; }
    .header p { font-size: 14px; opacity: 0.9; }
    .body { padding: 30px 40px; }
    .token-section { background: #f8f9fa; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .token-section label { display: block; font-weight: 600; color: #333; margin-bottom: 8px; font-size: 14px; }
    .token-section input { width: 100%; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; font-family: monospace; transition: border-color 0.2s; }
    .token-section input:focus { outline: none; border-color: #667eea; }
    .token-section .hint { font-size: 12px; color: #888; margin-top: 6px; }
    .token-section .hint a { color: #667eea; text-decoration: none; }
    .upload-area { border: 3px dashed #ccc; border-radius: 16px; padding: 50px 20px; text-align: center; cursor: pointer; transition: all 0.3s; margin-bottom: 20px; }
    .upload-area:hover { border-color: #667eea; background: #f8f9ff; }
    .upload-area.dragover { border-color: #667eea; background: #eef0ff; transform: scale(1.02); }
    .upload-area .icon { font-size: 48px; margin-bottom: 12px; }
    .upload-area .text { color: #666; font-size: 16px; }
    .upload-area .shortcut { color: #999; font-size: 13px; margin-top: 8px; }
    .progress { display: none; margin-bottom: 20px; }
    .progress.show { display: block; }
    .progress-bar { background: #e0e0e0; border-radius: 8px; height: 24px; overflow: hidden; }
    .progress-fill { background: linear-gradient(90deg, #667eea, #764ba2); height: 100%; width: 0%; transition: width 0.3s; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 600; }
    .result { display: none; margin-bottom: 20px; }
    .result.show { display: block; }
    .result-item { background: #f0f9ff; border: 1px solid #cce8ff; border-radius: 10px; padding: 16px; margin-bottom: 10px; }
    .result-item img { max-width: 120px; max-height: 120px; border-radius: 8px; margin-right: 14px; vertical-align: middle; }
    .result-item .info { display: inline-block; vertical-align: middle; }
    .result-item .url { font-family: monospace; font-size: 13px; color: #667eea; word-break: break-all; max-width: 400px; display: inline-block; }
    .result-item .btn-copy { margin-left: 8px; padding: 4px 12px; background: #667eea; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .result-item .btn-copy:hover { background: #5568d3; }
    .error { background: #fff0f0; border: 1px solid #ffccc; border-radius: 10px; padding: 12px 16px; color: #c0392b; font-size: 14px; margin-bottom: 16px; display: none; }
    .error.show { display: block; }
    .success { background: #e8f8f0; border: 1px solid #a8e6c3; border-radius: 10px; padding: 12px 16px; color: #1e8449; font-size: 14px; margin-bottom: 16px; display: none; }
    .success.show { display: block; }
    .history-section { margin-top: 30px; }
    .history-section h3 { font-size: 16px; color: #333; margin-bottom: 12px; border-bottom: 2px solid #e0e0e0; padding-bottom: 8px; }
    .history-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #f0f0f0; }
    .history-item img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; }
    .history-item .meta { flex: 1; }
    .history-item .meta .name { font-size: 13px; color: #333; }
    .history-item .meta .url { font-size: 11px; color: #999; font-family: monospace; }
    .history-item .meta .time { font-size: 11px; color: #aaa; }
    .history-item .btn-copy { padding: 4px 10px; background: #667eea; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; }
    .btn-clear { margin-top: 10px; padding: 6px 14px; background: #e74c3c; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📤 图床上传工具</h1>
      <p>图片上传到 GitHub 仓库 → 获取 raw.githubusercontent.com 公开 URL</p>
    </div>
    <div class="body">
      <div class="token-section">
        <label>🔑 GitHub Personal Access Token</label>
        <div style="display:flex;gap:8px;align-items:center;">
          <input type="password" id="tokenInput" placeholder="ghp_xxxx 或 gho_xxxx（需 repo 权限）" style="flex:1;">
          <span id="tokenSaveStatus" style="font-size:12px;color:#27ae60;white-space:nowrap;display:none;">✅ 已保存</span>
          <button type="button" id="btnClearToken" onclick="clearToken()" style="padding:6px 10px;background:#e74c3c;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;">🗑️ 忘记</button>
        </div>
        <div class="hint">Token 只存在你浏览器的 localStorage 中，不上传任何服务器。<br>
        没有 Token？<a href="https://github.com/settings/tokens/new?scopes=repo" target="_blank">点这里创建</a>（勾选 repo 权限）</div>
      </div>
      <div class="upload-area" id="uploadArea">
        <div class="icon">📁</div>
        <div class="text">点击选择文件 或 拖拽图片到这里</div>
        <div class="shortcut">Ctrl + V 粘贴图片 · 支持 JPG / PNG / GIF / WebP</div>
        <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">
      </div>
      <div class="progress" id="progress">
        <div class="progress-bar"><div class="progress-fill" id="progressFill">0%</div></div>
      </div>
      <div class="error" id="error"></div>
      <div class="success" id="success"></div>
      <div class="result" id="result"></div>
      <div class="history-section">
        <h3>📜 历史上传记录</h3>
        <div id="historyList"></div>
        <button class="btn-clear" style="background:#95a5a6;" id="btnClearLocal" onclick="clearHistory()">🗑️ 只清本地记录</button>
        <button class="btn-clear" style="background:#c0392b; margin-left:8px;" onclick="clearAllFromGitHub()">🧹 清空仓库所有图片</button>
      </div>
    </div>
  </div>

  <script>
    const REPO_OWNER = 'Aron18';
    const REPO_NAME = 'image-uploader';
    const REPO_BRANCH = 'main';
    const API_BASE = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents`;

    // 加载已存 token 和历史
    const tokenInput = document.getElementById('tokenInput');
    const tokenSaveStatus = document.getElementById('tokenSaveStatus');
    tokenInput.value = localStorage.getItem('gh_token') || '';
    if (tokenInput.value) {
      tokenSaveStatus.style.display = 'inline';  // 已有 token → 显示 ✅
    }

    // 失焦时保存（覆盖粘贴、自动填充、手动编辑所有场景）
    tokenInput.addEventListener('blur', () => saveToken());
    // 回车也保存
    tokenInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') saveToken();
    });

    function saveToken() {
      const v = tokenInput.value.trim();
      localStorage.setItem('gh_token', v);
      if (v) {
        tokenSaveStatus.textContent = '✅ 已保存';
        tokenSaveStatus.style.display = 'inline';
      }
    }

    window.clearToken = function() {
      if (!confirm('清除已保存的 GitHub Token？')) return;
      localStorage.removeItem('gh_token');
      tokenInput.value = '';
      tokenSaveStatus.style.display = 'none';
    };

    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const progress = document.getElementById('progress');
    const progressFill = document.getElementById('progressFill');
    const errorDiv = document.getElementById('error');
    const resultDiv = document.getElementById('result');

    // 点击上传
    uploadArea.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    // 拖拽
    uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });

    // 粘贴
    document.addEventListener('paste', (e) => {
      const items = e.clipboardData?.items || [];
      const imgs = [];
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          const blob = item.getAsFile();
          if (blob) imgs.push(blob);
        }
      }
      if (imgs.length) handleFiles(imgs);
    });

    function showError(msg) {
      errorDiv.textContent = '❌ ' + msg;
      errorDiv.classList.add('show');
      document.getElementById('success').classList.remove('show');
      setTimeout(() => errorDiv.classList.remove('show'), 8000);
    }

    function showSuccess(msg) {
      const successDiv = document.getElementById('success');
      successDiv.textContent = '✅ ' + msg;
      successDiv.classList.add('show');
      errorDiv.classList.remove('show');
      setTimeout(() => successDiv.classList.remove('show'), 5000);
    }

    const GITHUB_MAX = 100 * 1024 * 1024;  // GitHub Contents API 单文件上限 100MB
    const COMPRESS_THRESHOLD = 5 * 1024 * 1024;  // 超过 5MB 自动压缩

    async function handleFiles(files) {
      // 上传前强制保存 token（防止粘贴后直接点上传未触发 blur）
      saveToken();
      const token = tokenInput.value.trim();
      if (!token) { showError('请先输入 GitHub Token'); return; }
      if (!files || !files.length) return;

      progress.classList.add('show');
      resultDiv.classList.add('show');
      resultDiv.innerHTML = '';

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        if (!file.type.startsWith('image/')) continue;

        // 100MB 硬限制（GitHub API）
        if (file.size > GITHUB_MAX) {
          showError(`${file.name} 超过 GitHub 100MB 限制（${(file.size/1024/1024).toFixed(1)}MB）`);
          continue;
        }

        // 大图自动压缩（保持清晰度，显著减少体积）
        let uploadFile = file;
        if (file.size > COMPRESS_THRESHOLD) {
          try {
            const compressed = await compressImage(file, 2048, 0.85);
            console.log(`[压缩] ${file.name}: ${(file.size/1024).toFixed(0)}KB → ${(compressed.size/1024).toFixed(0)}KB`);
            uploadFile = compressed;
          } catch (e) {
            console.warn('[压缩失败，使用原图]', e.message);
          }
        }

        const pct = Math.round(((i) / files.length) * 100);
        progressFill.style.width = pct + '%';
        progressFill.textContent = pct + '%';

        try {
          const { filename, sha, url } = await uploadToGitHub(uploadFile, token);
          addResult(uploadFile, url);
          saveHistory(uploadFile, { filename, sha, url });
        } catch (e) {
          showError(uploadFile.name + ': ' + e.message);
        }
      }
      progressFill.style.width = '100%';
      progressFill.textContent = '完成';
      setTimeout(() => { progress.classList.remove('show'); progressFill.style.width = '0%'; }, 2000);
      renderHistory();
    }

    /**
     * Canvas 前端压缩：等比缩到 maxDim（保留长宽比），输出 JPEG quality
     * 比原 btoa+spread 快且不会爆栈
     */
    async function compressImage(file, maxDim = 2048, quality = 0.85) {
      const img = await new Promise((res, rej) => {
        const url = URL.createObjectURL(file);
        const i = new Image();
        i.onload = () => { URL.revokeObjectURL(url); res(i); };
        i.onerror = rej;
        i.src = url;
      });
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      return new Promise((resolve) => {
        canvas.toBlob((blob) => resolve(new File([blob], file.name.replace(/\.\w+$/, '.jpg'), { type: 'image/jpeg' })), 'image/jpeg', quality);
      });
    }

    /**
     * 分块 base64 编码（解决 spread 对大图爆 call stack）
     * 每次取 8KB 块，逐块转 String.fromCharCode 再 btoa
     */
    async function fileToBase64(file) {
      const CHUNK = 8 * 1024;  // 8KB 每块
      const buf = new Uint8Array(await file.arrayBuffer());
      let binary = '';
      for (let i = 0; i < buf.length; i += CHUNK) {
        // slice 不会爆栈——每次只处理 8KB，函数参数远小于 65536 上限
        binary += String.fromCharCode.apply(null, buf.subarray(i, i + CHUNK));
      }
      return btoa(binary);
    }

    async function uploadToGitHub(file, token) {
      const ts = Date.now();
      const ext = file.name.match(/\.(png|jpe?g|gif|webp|bmp)$/i)?.[1]?.toLowerCase() || 'png';
      const filename = `images/${ts}-${Math.random().toString(36).slice(2, 8)}.${ext}`;

      console.log(`[upload] ${filename}, ${(file.size/1024).toFixed(0)}KB, 正在 base64...`);
      const content = await fileToBase64(file);

      const res = await fetch(`${API_BASE}/${filename}`, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          message: `upload: ${file.name}`,
          content: content,
          branch: REPO_BRANCH,
        }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || `HTTP ${res.status}`);
      }

      const data = await res.json();
      // raw URL（直链，CDN 加速）
      const rawUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${REPO_BRANCH}/${filename}`;
      return { filename, sha: data.content.sha, url: rawUrl };
    }

    function addResult(file, url) {
      const div = document.createElement('div');
      div.className = 'result-item';
      div.innerHTML = `
        <a href="${url}" target="_blank" title="点击在新标签页打开">
          <img src="${url}" onerror="this.style.display='none'" style="cursor:pointer;border-radius:8px;">
        </a>
        <div class="info">
          <div style="font-size:13px;color:#333;margin-bottom:4px;">📄 ${file.name} (${(file.size/1024).toFixed(0)}KB)</div>
          <div class="url">${url}</div>
          <button class="btn-copy" onclick="copyUrl('${url}')">📋 复制</button>
          <a href="${url}" target="_blank" style="margin-left:6px;font-size:12px;color:#667eea;text-decoration:none;">🔗 打开</a>
        </div>
      `;
      resultDiv.appendChild(div);
    }

    function copyUrl(url) {
      navigator.clipboard.writeText(url).then(() => {
        const btn = event.target;
        const old = btn.textContent;
        btn.textContent = '✅ 已复制';
        setTimeout(() => btn.textContent = old, 1500);
      });
    }

    // 历史记录（存 sha 和 filename，用于未来删除）
    function saveHistory(file, info) {
      const hist = JSON.parse(localStorage.getItem('upload_history') || '[]');
      hist.unshift({
        name: file.name,
        size: file.size,
        url: info.url,
        filename: info.filename,  // images/xxx.jpg
        sha: info.sha,            // GitHub file SHA，用于 DELETE
        time: new Date().toLocaleString('zh-CN'),
      });
      localStorage.setItem('upload_history', JSON.stringify(hist.slice(0, 50)));
    }

    function renderHistory() {
      const hist = JSON.parse(localStorage.getItem('upload_history') || '[]');
      const list = document.getElementById('historyList');
      if (!hist.length) {
        list.innerHTML = '<div style="color:#ccc;text-align:center;padding:20px;">暂无记录</div>';
        return;
      }
      list.innerHTML = hist.map((h, idx) => `
        <div class="history-item">
          <a href="${h.url}" target="_blank" rel="noopener" title="点击在新标签页打开" style="display:inline-block;text-decoration:none;cursor:pointer;">
            <img src="${h.url}" style="width:40px;height:40px;object-fit:cover;border-radius:6px;margin-right:12px;cursor:pointer;" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22><rect fill=%22%23ddd%22 width=%2240%22 height=%2240%22/></svg>'">
          </a>
          <div class="meta">
            <div class="name">${h.name} (${(h.size/1024).toFixed(0)}KB)</div>
            <div class="url" title="${h.filename || ''}">${h.url}</div>
            <div class="time">${h.time}</div>
          </div>
          <button class="btn-copy" onclick="copyUrl('${h.url}')">📋 复制</button>
          <button class="btn-copy" style="background:#e74c3c; margin-left:6px;" onclick="deleteFile('${idx}')">🗑️ 删除</button>
        </div>
      `).join('');
    }

    /**
     * 删除单张图片：从 GitHub 仓库 DELETE，同时从 localStorage 移除
     * 上传时有 sha → 直接用；旧历史记录没有 sha → 先 GET 拿
     * 旧历史记录没有 filename → 从 raw URL 里解析
     * 文件已被删（404）→ 静默清理 localStorage 对应条目
     */
    window.deleteFile = async function(idx) {
      const token = localStorage.getItem('gh_token');
      if (!token) { showError('请先输入 GitHub Token'); return; }
      const hist = JSON.parse(localStorage.getItem('upload_history') || '[]');
      const item = hist[idx];
      if (!item) return;

      // 从 URL 解析 filename（旧历史记录没有存）
      let filename = item.filename;
      if (!filename && item.url) {
        // raw URL: https://raw.githubusercontent.com/owner/repo/main/images/xxx.png
        const m = item.url.match(/\/(images\/[^/?#]+)/);
        if (m) filename = m[1];
      }
      if (!filename) {
        showError('无法确定文件路径，请重新上传');
        return;
      }

      if (!confirm(`确定删除 ${item.name}？\n将从 GitHub 仓库永久删除，不可恢复。`)) return;

      try {
        let sha = item.sha;
        if (!sha) {
          const res = await fetch(`${API_BASE}/${filename}`, { headers: { Authorization: `Bearer ${token}` } });
          if (res.status === 404) {
            // 文件已被删掉 → 清理 localStorage 即可
            hist.splice(idx, 1);
            localStorage.setItem('upload_history', JSON.stringify(hist));
            renderHistory();
            showSuccess('文件已不存在，已从本地记录清除');
            return;
          }
          if (!res.ok) throw new Error('获取文件 SHA 失败: ' + res.status);
          sha = (await res.json()).sha;
        }
        const delRes = await fetch(`${API_BASE}/${filename}`, {
          method: 'DELETE',
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: `delete: ${item.name}`, sha, branch: REPO_BRANCH }),
        });
        if (delRes.status === 404) {
          hist.splice(idx, 1);
          localStorage.setItem('upload_history', JSON.stringify(hist));
          renderHistory();
          showSuccess('文件已不存在，已从本地记录清除');
          return;
        }
        if (!delRes.ok) {
          const err = await delRes.json().catch(() => ({}));
          throw new Error(err.message || '删除失败 HTTP ' + delRes.status);
        }
        hist.splice(idx, 1);
        localStorage.setItem('upload_history', JSON.stringify(hist));
        renderHistory();
        showSuccess('已删除 ' + item.name);
      } catch (e) {
        showError('删除失败: ' + e.message);
      }
    };

    /**
     * 批量清空：统计 images/ 和 keyframes/ 两个目录全部文件 → 逐个 DELETE → 服务端验证 → 同步清理 localStorage
     * keyframes/ 存放 Agnes 视频工作室上传的首尾帧，清空时一并处理
     */
    window.clearAllFromGitHub = async function() {
      const token = localStorage.getItem('gh_token');
      if (!token) { showError('请先输入 GitHub Token'); return; }

      // 统计 images/ 和 keyframes/ 两个目录（keyframes/ 存放视频工作室上传的首尾帧）
      const DIRS = ['images', 'keyframes'];
      const all = [];      // {dir, file}
      const counts = {};
      for (const dir of DIRS) {
        try {
          const res = await fetch(`${API_BASE}/${dir}`, { headers: { Authorization: `Bearer ${token}` } });
          if (res.status === 404) { counts[dir] = 0; continue; }   // 目录不存在 = 空
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const list = await res.json();
          counts[dir] = Array.isArray(list) ? list.length : 0;
          if (Array.isArray(list)) list.forEach(f => all.push({ dir, file: f }));
        } catch (e) {
          showError(`获取 ${dir}/ 目录失败: ` + e.message);
          return;
        }
      }

      if (!all.length) { showSuccess('仓库为空（images/ 与 keyframes/ 都没有文件）'); return; }

      if (!confirm(`仓库共有 ${all.length} 个文件（images/ ${counts.images} 张 + keyframes/ ${counts.keyframes} 张），确定全部删除？\n将从 GitHub 仓库永久删除，不可恢复。`)) return;

      const deletedNames = new Set();
      const failed = [];   // {name, reason}
      let done = 0;
      for (const { dir, file: f } of all) {
        let ok = false, lastErr = '';
        // 网络不稳时（代理吞响应）重试一次；404 视为成功（文件已不在=目的已达成）
        for (let attempt = 0; attempt < 2 && !ok; attempt++) {
          try {
            const delRes = await fetch(`${API_BASE}/${f.path}`, {
              method: 'DELETE',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: `bulk-delete: ${f.name}`, sha: f.sha, branch: REPO_BRANCH }),
            });
            if (delRes.ok || delRes.status === 404) { ok = true; }
            else {
              const err = await delRes.json().catch(() => ({}));
              lastErr = err.message || 'HTTP ' + delRes.status;
              if (delRes.status < 500 && delRes.status !== 429) break; // 4xx 无需重试
            }
          } catch (e) {
            lastErr = '网络错误: ' + e.message;
          }
        }
        if (ok) { done++; deletedNames.add(f.name); }
        else failed.push({ name: `${dir}/${f.name}`, reason: lastErr });
      }

      // 关键：以服务端实际状态为准。
      // 响应可能在传输中丢失（代理网络），但删除已生效——重新 GET 验证真实剩余。
      let remaining = null;
      try {
        const remainList = [];
        for (const dir of DIRS) {
          const res = await fetch(`${API_BASE}/${dir}`, { headers: { Authorization: `Bearer ${token}` } });
          if (res.ok) {
            const list = await res.json();
            if (Array.isArray(list)) list.forEach(f => remainList.push(`${dir}/${f.name}`));
          } // 404 = 目录已消失，无剩余
        }
        remaining = remainList;
      } catch (e) { /* 验证失败时以逐个结果为准 */ }

      // 同步清理 localStorage：移除"确认已不在仓库 images/"的记录
      const imagesGone = remaining !== null
        ? all.filter(x => x.dir === 'images' && !remaining.includes(`images/${x.file.name}`)).map(x => x.file.name)
        : [...deletedNames];
      const hist = JSON.parse(localStorage.getItem('upload_history') || '[]');
      const keep = hist.filter(h => {
        const repoName = h.filename ? h.filename.split('/').pop() : null;
        return !repoName || !imagesGone.includes(repoName);
      });
      localStorage.setItem('upload_history', JSON.stringify(keep));
      renderHistory();

      if (remaining !== null && remaining.length === 0) {
        showSuccess(`清空完成：images/ 与 keyframes/ 已全部删除（共 ${all.length} 个文件）✅`);
      } else if (remaining !== null && remaining.length < all.length) {
        showSuccess(`清空部分完成：已删 ${all.length - remaining.length} 个，剩余 ${remaining.length} 个未成功（${failed.map(f => f.name).join('、') || '可点重试'}）`);
      } else if (done > 0) {
        showSuccess(`清空完成：删除 ${done} 个${failed.length ? `，${failed.length} 个结果未知（网络响应丢失，可刷新核实）` : ''}`);
      } else {
        showError(`清空失败：${failed.map(f => `${f.name}（${f.reason}）`).join('；')}`);
      }
    };

    function clearHistory() {
      // 只清 localStorage 不清 GitHub（批量删用 clearAllFromGitHub）
      if (!confirm('只清除本地历史记录？仓库里的图片不会删除。')) return;
      localStorage.removeItem('upload_history');
      renderHistory();
    }

    renderHistory();
  </script>
</body>
</html>
